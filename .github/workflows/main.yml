name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # BUILD JOB — validate composer vendor
  # ----------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pdo, bcmath, gd, exif
          coverage: none

      - name: Install Composer dependencies
        env:
          BROADCAST_CONNECTION: log
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

  # ----------------------------------------------------------------------------
  # DEPLOY TO PRODUCTION
  # ----------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pdo, bcmath, gd, exif
          coverage: none

      - name: Install Composer dependencies
        env:
          BROADCAST_CONNECTION: log
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Deploy to FTP (production)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.PRODUCTION_FTP_SERVER }}
          username: ${{ secrets.PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
          server-dir: /
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            **/tests/**
            **/.env
            **/.env.local
            **/.env.*.local
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.phpunit*
            **/phpunit.xml*
            **/vite.config.*
            **/tailwind.config.*
            **/postcss.config.*
            **/package.json
            **/package-lock.json
            **/docker-compose*
            **/database/*.sqlite*
          dangerous-clean-slate: false
          log-level: standard
